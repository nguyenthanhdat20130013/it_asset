services:
  server:
    build: ./server
    restart: always
    environment:
      # Use host.docker.internal to connect to MySQL running on the host machine
      DATABASE_URL: mysql://root:your_strong_password@host.docker.internal:3306/it_asset_management
      JWT_SECRET: your_very_strong_production_secret_key_123!
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    build: ./client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
